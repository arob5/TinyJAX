[project]
name = "tinyjax"
version = "0.1.0"
description = "A minimal, pedagogical re-implementation of JAX's core ideas"
readme = "README.md"
authors = [
    { name = "Andrew Roberts", email = "agr.roberts@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.5",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jax>=0.12.0.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
